
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/login.css">
</head>
<body>

    <div class="container">

        <img class="box1" src="../Images/login.png">

        <div class="box2">

            <h1>Foodie<span>Hub</span></h1>

            <h3>Hey! Welcome to FoodieHub</h3>

            <label for="name">Username</label>
            <br>
            <input type="text" id="name" placeholder="enter your username">

            <br>

            <label for="psd">Password</label>
            <br>
            <input type="password" placeholder="enter your password" id="psd">

            <button type="button" id="show">Show Password</button>

            <br>

            <p id="error" style="color:red; text-align:center;"></p>

            <p id="success" style="color:green; text-align:center;"></p>

            <button type="button" class="login" id="login">
                Login
            </button>

            <h4 style="text-align: center;">
                ____________________OR____________________
            </h4>

            <h5>Don't have an Account?</h5>

            <button type="button" style="margin-bottom: 80px;">
                <a href="../HTML/registration.html">Register</a>
            </button>

        </div>
    </div>

    <script src="../JAVASCRIPT/login.js"></script>

</body>
</html>
