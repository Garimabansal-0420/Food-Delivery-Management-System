<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favorite Restaurants</title>

    <link rel="stylesheet" href="index.css">

</head>


<body>


    <!-- ============================= -->
    <!-- NAVBAR -->
    <!-- ============================= -->

    <header class="navbar">

        <div class="nav-container">


            <!-- SWIGGY LOGO -->

            <div class="logo">

                <div class="logo-box">

                    <div class="logo-pin"></div>

                </div>

            </div>


            <!-- OTHER -->

            <div class="other">

                <a href="#">
                    Other
                </a>

                <span class="other-arrow">
                    ▼
                </span>

            </div>


            <!-- NAVIGATION -->

            <nav class="nav-links">


                <!-- SWIGGY CORPORATE -->

                <a href="#" class="nav-item">

                    <span class="nav-icon briefcase-icon"></span>

                    <span>
                        Swiggy Corporate
                    </span>

                </a>


                <!-- SEARCH -->

                <a href="#" class="nav-item">

                    <span class="nav-icon search-icon"></span>

                    <span>
                        Search
                    </span>

                </a>


                <!-- HELP -->

                <a href="#" class="nav-item">

                    <span class="nav-icon help-icon">
                        ?
                    </span>

                    <span>
                        Help
                    </span>

                </a>


                <!-- USER -->

                <a href="#" class="nav-item">

                    <span class="nav-icon user-icon"></span>

                    <span>
                        User
                    </span>

                </a>


                <!-- CART -->

                <a href="#" class="nav-item">

                    <span class="nav-icon cart-icon"></span>

                    <span>
                        Cart
                    </span>

                </a>


            </nav>

        </div>

    </header>



    <!-- ============================= -->
    <!-- MAIN CONTENT -->
    <!-- ============================= -->

    <main>

        <section class="favorites-section">

            <div class="favorites-container">


                <!-- TITLE -->

                <h1>
                    Favorite Restaurants
                </h1>


                <!-- ============================= -->
                <!-- SORT -->
                <!-- ============================= -->

                <div class="sort-container">

                    <select class="sort-select">

                        <option selected>
                            Sort By
                        </option>

                        <option>
                            Rating: High to Low
                        </option>

                        <option>
                            Rating: Low to High
                        </option>

                        <option>
                            Name: A to Z
                        </option>

                        <option>
                            Name: Z to A
                        </option>

                        <option>
                            Price: Low to High
                        </option>

                        <option>
                            Price: High to Low
                        </option>

                    </select>

                </div>



                <!-- ============================= -->
                <!-- RESTAURANTS -->
                <!-- ============================= -->

                <div class="restaurant-grid">


                    <!-- ============================= -->
                    <!-- BURGER SINGH -->
                    <!-- ============================= -->

                    <div class="restaurant-card">


                        <div class="restaurant-image">

                            <img
                                src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=700&q=80"
                                alt="Burger Singh"
                            >

                            <div class="price-overlay">
                                ITEMS AT ₹46
                            </div>

                        </div>


                        <div class="restaurant-info">


                            <h2>
                                Burger Singh(Big Punjabi...
                            </h2>


                            <div class="rating">

                                <span class="star">
                                    ★
                                </span>

                                <span>
                                    4.3
                                </span>

                            </div>


                            <p>
                                Burgers, Snacks, Desserts, Beverages...
                            </p>


                            <p>
                                Civil Lines
                            </p>


                            <!-- BUTTONS -->

                            <div class="restaurant-buttons">

                                <button class="order-btn">
                                    Order Now
                                </button>

                                <button class="remove-btn">
                                    Remove
                                </button>

                            </div>


                        </div>

                    </div>



                    <!-- ============================= -->
                    <!-- MCDONALD'S -->
                    <!-- ============================= -->

                    <div class="restaurant-card">


                        <div class="restaurant-image">

                            <img
                                src="https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=700&q=80"
                                alt="McDonald's"
                            >

                            <div class="price-overlay">
                                ITEMS AT ₹51
                            </div>

                        </div>


                        <div class="restaurant-info">


                            <h2>
                                McDonald's
                            </h2>


                            <div class="rating">

                                <span class="star">
                                    ★
                                </span>

                                <span>
                                    4.4
                                </span>

                            </div>


                            <p>
                                American, Fast Food, Beverages
                            </p>


                            <p>
                                Civil Lines
                            </p>


                            <!-- BUTTONS -->

                            <div class="restaurant-buttons">

                                <button class="order-btn">
                                    Order Now
                                </button>

                                <button class="remove-btn">
                                    Remove
                                </button>

                            </div>


                        </div>

                    </div>


                </div>

            </div>

        </section>

    </main>


</body>

</html>
