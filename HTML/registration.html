
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration</title>

    <link rel="stylesheet" href="../CSS/registration.css">

</head>

<body>

    <div class="container">

        <img class="box1" src="../Images/register.png">

        <div class="box2">

            <h1>Foodie<span>Hub</span></h1>

            <h3>Create Your Account</h3>

            <label for="name">Username</label>
            <br>

            <input type="text" id="name" placeholder="enter your username">


            <label for="email">Email</label>
            <br>

            <input type="email" id="email" placeholder="enter your email">


            <label for="phone">Phone Number</label>
            <br>

            <input type="tel" id="phone" placeholder="enter your phone number">


            <label for="psd">Password</label>
            <br>

            <input type="password" id="psd" placeholder="enter your password">


            <label for="cpsd">Confirm Password</label>
            <br>

            <input type="password" id="cpsd" placeholder="confirm your password">

            <br>

            <button type="submit" class="register">
                Register
            </button>


            <h4 style="text-align: center;">
                ____________________OR____________________
            </h4>


            <h5>Already have an Account?</h5>

            <button type="submit" style="margin-bottom: 30px;">
                <a href="../HTML/login.html">Login</a>
            </button>

        </div>

    </div>

</body>

</html>
